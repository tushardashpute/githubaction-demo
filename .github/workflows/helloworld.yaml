name: Hello World workflow

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    hello:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            - name: Print Hello World
              run: echo "Hello World"
              shell: bash

    goodbye:
        runs-on: ubuntu-latest
        steps:
            - name: print goodbye
              run: echo "Goodbye world"
              shell : bash